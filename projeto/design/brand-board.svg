<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1120" width="1440" height="1120" role="img" aria-labelledby="title desc">
  <title id="title">MOVRA — proposta de identidade e design system</title>
  <desc id="desc">Prancha estática com marca em verde profundo e lima, mensagem Cada treino, um próximo passo, paleta, tipografia e amostras de estados. Conceito para aprovação; não é uma interface funcional.</desc>
